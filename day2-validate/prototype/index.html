<!DOCTYPE html>
<!-- Clickable mockup for Scenario A: ServiceSG enquiry response.
     All data is synthetic (see data.js). No AI is called; drafts are scripted.
     Open this file in a browser. No server or install needed. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServiceSG draft reply mockup (synthetic)</title>
<style>
  :root {
    --ink: #1f2b28;            /* deep pine, near-black with warmth */
    --muted: #68736e;
    --line: #e3e0d8;           /* limestone hairline */
    --accent: #1f6f54;         /* viridian: actions and citations */
    --accent-deep: #14503c;
    --accent-soft: #e9f2ee;
    --brass: #9a7b3f;          /* brass: provenance and source marks */
    --brass-soft: #f5efe2;
    --warn: #8a5a00; --warn-soft: #fdf3dd;
    --ok: #1e6b3a; --ok-soft: #e7f4ec;
    --bg: #f7f6f2;             /* warm limestone paper */
    --card: #fffefb;
    --shadow-rest: 0 1px 2px rgba(31,43,40,.05), 0 8px 24px -12px rgba(31,43,40,.14);
    --shadow-lift: 0 2px 4px rgba(31,43,40,.06), 0 16px 36px -14px rgba(31,43,40,.22);
    --radius: 14px;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--sans); font-size: 14.5px; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  button, .enq, .line.cited, .passage { transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
  @media (prefers-reduced-motion: reduce) { *, html { transition: none !important; animation: none !important; scroll-behavior: auto; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  header { background: linear-gradient(180deg, #ffffff 0%, #fbfaf7 100%); color: var(--ink); padding: 18px 28px 16px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  header h1 { font-family: var(--serif); font-size: 21px; letter-spacing: .01em; margin: 0; font-weight: 600; }
  header .tag { font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); padding: 3px 12px; border-radius: 999px; }
  .wrap { display: flex; min-height: calc(100vh - 60px); }
  /* Inbox */
  .inbox { width: 304px; border-right: 1px solid var(--line); background: transparent; flex-shrink: 0; padding: 10px 0; }
  .inbox h2 { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--ink); padding: 14px 22px 10px; margin: 0; }
  .enq { margin: 3px 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; }
  .enq:hover { background: var(--card); border-color: var(--line); }
  .enq.active { background: var(--card); border-color: var(--line); box-shadow: var(--shadow-rest); }
  .enq .subj { font-weight: 600; font-size: 14px; letter-spacing: .005em; }
  .enq .from { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 10px; border-radius: 999px; margin-top: 8px; }
  .badge.high { background: var(--ok-soft); color: var(--ok); }
  .badge.low { background: var(--warn-soft); color: var(--warn); }
  .badge.img { background: var(--brass-soft); color: var(--brass); }
  /* Main panes */
  .main { flex: 1; display: flex; gap: 20px; padding: 24px 28px; align-items: flex-start; flex-wrap: wrap; }
  .pane { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow-rest); }
  .pane h3 { margin: 0 0 14px; font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--ink); }
  .enquiry-pane { flex: 1; min-width: 260px; }
  .draft-pane { flex: 1.4; min-width: 320px; }
  .cite-pane { flex: 1; min-width: 260px; position: sticky; top: 24px; }
  .photo-placeholder { border: 1.5px dashed var(--brass); background: var(--brass-soft); border-radius: 10px; padding: 28px 12px; text-align: center; color: var(--brass); font-size: 13px; margin-top: 14px; }
  /* Draft lines */
  .line { padding: 8px 12px; border-radius: 8px; margin: 3px 0; line-height: 1.65; }
  .line.cited { cursor: pointer; }
  .line.cited:hover { background: var(--accent-soft); }
  .line.cited.showing { background: var(--accent-soft); box-shadow: inset 2.5px 0 0 var(--accent); }
  .line.low { border-bottom: 2px dotted var(--warn); background: var(--warn-soft); }
  .cite-chip { font-size: 11px; color: var(--accent-deep); background: var(--accent-soft); border: 1px solid rgba(31,111,84,.18); border-radius: 999px; padding: 1px 9px; margin-left: 8px; white-space: nowrap; }
  .low-chip { font-size: 11px; color: var(--warn); margin-left: 8px; white-space: nowrap; }
  .watermark { font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 7px 12px; margin-bottom: 12px; }
  .rationale { font-size: 12.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
  /* Buttons */
  .actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  button { font-family: var(--sans); font-size: 13.5px; font-weight: 500; padding: 9px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-deep); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 14px -6px rgba(31,111,84,.5); }
  button.primary:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; transform: translateY(-1px); box-shadow: 0 6px 18px -6px rgba(31,111,84,.55); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .draft-editor { width: 100%; min-height: 170px; font: inherit; line-height: 1.65; padding: 14px; border: 1px solid var(--accent); border-radius: 10px; background: #fff; box-shadow: inset 0 1px 3px rgba(31,43,40,.05); }
  .draft-editor:focus { outline: none; box-shadow: inset 0 1px 3px rgba(31,43,40,.05), 0 0 0 3px var(--accent-soft); }
  .approved-note { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(30,107,58,.15); border-radius: 10px; padding: 12px 16px; margin-top: 14px; font-size: 14px; }
  /* Citation panel */
  .passage { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 13.5px; line-height: 1.6; }
  .passage.hit { border-color: var(--brass); background: var(--brass-soft); box-shadow: var(--shadow-rest); }
  .passage .src { font-size: 11.5px; color: var(--brass); margin-top: 8px; }
  .closest { margin: 0; padding-left: 18px; }
  .closest li { margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
  .empty-hint { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px; }
  /* Session clock and results */
  .clock { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); border: 1px solid var(--line); background: var(--card); padding: 5px 14px; border-radius: 999px; display: flex; align-items: center; gap: 12px; }
  .clock strong { color: var(--ink); font-weight: 600; }
  .clock button { padding: 4px 14px; font-size: 12.5px; }
  .results-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
  .results-table th, .results-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .results-table th { font-weight: 600; color: var(--muted); font-size: 12px; }
  .verdict { border-radius: 10px; padding: 12px 16px; margin: 10px 0; font-size: 14px; }
  .verdict.pass { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(30,107,58,.15); }
  .verdict.fail { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(138,90,0,.2); }
</style>
</head>
<body>
<header>
  <h1>ServiceSG enquiry inbox — draft reply mockup</h1>
  <span class="tag">Prototype · all data synthetic (made up)</span>
  <span class="tag">No AI called · drafts are scripted</span>
  <span class="clock" id="clock"></span>
</header>

<div class="wrap">
  <nav class="inbox" id="inbox"><h2>Shared inbox (synthetic)</h2></nav>

  <main class="main" id="main"></main>
</div>

<footer>Day 2 validation prototype · Scenario A · every name, number and policy in this page is made up.</footer>

<script src="data.js"></script>
<script>
let activeId = ENQUIRIES[0].id;
let editing = false;
let approved = {};          // enquiry id -> true once approved
let editedText = {};        // enquiry id -> officer's edited draft text
let shownCite = null;       // [pageId, passageId] currently highlighted
let showResults = false;

// Test measurement (validation-brief.md). All timings are per enquiry.
const SESSION_MINUTES = 10;         // mild time pressure for five drafted enquiries
let sessionStart = null;            // set when the tester starts the clock
const track = {};                   // enquiry id -> {firstOpen, decidedAt, citesOpened, editSessions}
for (const e of ENQUIRIES) track[e.id] = { firstOpen: null, decidedAt: null, citesOpened: 0, editSessions: 0 };

function touchOpen(id) {
  if (sessionStart && track[id].firstOpen === null) track[id].firstOpen = Date.now();
}

function originalDraftText(enq) {
  return enq.draft.map(l => l.text).join("\n\n");
}

// Share of words changed between the original draft and the approved text.
function changedShare(enq) {
  if (!editedText[enq.id]) return 0;
  const a = originalDraftText(enq).toLowerCase().split(/\s+/).filter(Boolean);
  const b = editedText[enq.id].toLowerCase().split(/\s+/).filter(Boolean);
  const counts = {};
  for (const w of a) counts[w] = (counts[w] || 0) + 1;
  let kept = 0;
  for (const w of b) if (counts[w] > 0) { counts[w]--; kept++; }
  return 1 - kept / Math.max(a.length, 1);
}

// The planted error survives if its distinctive wrong claim is still present.
function plantedErrorSurvived(enq) {
  if (!enq.draft || !enq.draft.some(l => l.plantedError)) return null;
  const finalText = (editedText[enq.id] || originalDraftText(enq)).toLowerCase();
  return finalText.includes("fee") && finalText.includes("$5");
}

function renderInbox() {
  const nav = document.getElementById("inbox");
  nav.innerHTML = "<h2>Shared inbox (synthetic)</h2>";
  for (const enq of ENQUIRIES) {
    const div = document.createElement("div");
    div.className = "enq" + (enq.id === activeId ? " active" : "");
    let badge;
    if (enq.hasImage) badge = '<span class="badge img">has image · cannot read</span>';
    else if (enq.lowConfidence) badge = '<span class="badge low">low confidence</span>';
    else badge = '<span class="badge high">draft ready</span>';
    div.innerHTML = '<div class="subj">' + enq.subject + '</div>' +
                    '<div class="from">' + enq.from + '</div>' + badge +
                    (approved[enq.id] ? ' <span class="badge high">approved</span>' : '');
    div.onclick = () => { activeId = enq.id; editing = false; shownCite = null; showResults = false; touchOpen(enq.id); render(); };
    nav.appendChild(div);
  }
}

function renderClock() {
  const el = document.getElementById("clock");
  if (!sessionStart) {
    el.innerHTML = '<button class="primary" onclick="startSession()">Start test session</button>';
    return;
  }
  const left = SESSION_MINUTES * 60 - Math.floor((Date.now() - sessionStart) / 1000);
  const m = Math.max(0, Math.floor(left / 60)), s = Math.max(0, left % 60);
  el.innerHTML = 'Session: <strong>' + m + ":" + String(s).padStart(2, "0") + '</strong>' +
    (left <= 0 ? ' <span style="color:var(--warn)">time up</span>' : '') +
    ' <button onclick="finishSession()">Finish test</button>';
}

function startSession() {
  sessionStart = Date.now();
  touchOpen(activeId);
  render();
  if (!window.__clockTimer) window.__clockTimer = setInterval(renderClock, 1000);
}

function finishSession() { showResults = true; render(); }

function renderResults(main) {
  const rows = [];
  let decided = 0, lightEdits = 0, rewrites = 0, errorCaught = null;
  for (const enq of ENQUIRIES) {
    if (!enq.draft) continue;
    const t = track[enq.id];
    const secs = t.firstOpen && t.decidedAt ? Math.round((t.decidedAt - t.firstOpen) / 1000) : null;
    const share = changedShare(enq);
    const planted = plantedErrorSurvived(enq);
    let outcome = "not decided";
    if (approved[enq.id]) {
      decided++;
      if (share === 0) outcome = "approved as-is";
      else if (share <= 0.6) { outcome = "light edit (" + Math.round(share * 100) + "% changed)"; lightEdits++; }
      else { outcome = "rewritten (" + Math.round(share * 100) + "% changed)"; rewrites++; }
    }
    if (planted !== null && approved[enq.id]) errorCaught = !planted;
    rows.push("<tr><td>" + enq.subject + "</td><td>" + (secs === null ? "—" : secs + "s") + "</td><td>" +
      t.citesOpened + "</td><td>" + outcome +
      (planted !== null ? (planted ? " · <strong>planted error approved</strong>" : " · planted error caught") : "") + "</td></tr>");
  }
  const kills = [];
  if (errorCaught === false) kills.push("The planted stale-fee error was approved and would have reached a resident.");
  if (rewrites > 0) kills.push(rewrites + " draft(s) were rewritten (more than 60% of words changed).");
  const verdict = kills.length
    ? '<div class="verdict fail">Kill-switch signal: ' + kills.join(" ") + '</div>'
    : (decided === 0 ? '<div class="verdict fail">No drafts decided yet — run the session first.</div>'
    : '<div class="verdict pass">No kill-switch signal. ' + decided + ' decided, ' + lightEdits + ' after a light edit' +
      (errorCaught === true ? ', planted error caught' : errorCaught === null ? ', planted-error enquiry not decided' : '') + '.</div>');
  const pane = document.createElement("section");
  pane.className = "pane draft-pane";
  pane.style.flex = "1 1 100%";
  pane.innerHTML = "<h3>Test results (this session, synthetic)</h3>" + verdict +
    '<table class="results-table"><tr><th>Enquiry</th><th>Open → decision</th><th>Citations opened</th><th>Outcome</th></tr>' +
    rows.join("") + "</table>" +
    '<p class="rationale">Copy these results into day2-validate/validation-brief.md under Results. Reload the page to reset the session.</p>';
  main.appendChild(pane);
}

function renderMain() {
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (showResults) { renderResults(main); return; }
  const enq = ENQUIRIES.find(e => e.id === activeId);

  // Enquiry pane
  const ep = document.createElement("section");
  ep.className = "pane enquiry-pane";
  ep.innerHTML = "<h3>Enquiry</h3><p><strong>" + enq.subject + "</strong></p><p>" + enq.body + "</p>" +
    (enq.hasImage ? '<div class="photo-placeholder">📷 Attached photo (synthetic placeholder)<br>The current tools cannot read this image.</div>' : "") +
    '<p class="rationale">Confidence: ' + enq.confidence + "</p>";
  main.appendChild(ep);

  // Draft pane
  const dp = document.createElement("section");
  dp.className = "pane draft-pane";

  if (enq.draft === null) {
    dp.innerHTML = "<h3>No draft</h3>" +
      "<p>This enquiry depends on an image the current tools cannot read, so no draft is offered.</p>" +
      "<p>The three closest policy pages are listed on the right as a starting point.</p>" +
      '<p class="rationale">' + enq.rationale + "</p>" +
      '<div class="actions"><button class="primary" onclick="alert(\'Mockup: in the real tool this opens a blank reply for the officer to write.\')">Write reply myself</button></div>';
    main.appendChild(dp);
  } else if (approved[enq.id]) {
    dp.innerHTML = "<h3>Draft reply</h3>" +
      '<div class="approved-note">✓ Approved and queued for sending. The officer\'s edits are logged. (mockup — nothing is sent)</div>' +
      '<div class="line" style="white-space:pre-wrap; margin-top:10px;">' + (editedText[enq.id] || originalDraftText(enq)) + "</div>";
    main.appendChild(dp);
  } else if (editing) {
    dp.innerHTML = "<h3>Draft reply — editing</h3>";
    const ta = document.createElement("textarea");
    ta.className = "draft-editor";
    ta.id = "editor";
    ta.value = editedText[enq.id] || originalDraftText(enq);
    dp.appendChild(ta);
    const act = document.createElement("div");
    act.className = "actions";
    act.innerHTML =
      '<button class="primary" onclick="saveAndApprove()">Approve</button>' +
      '<button onclick="saveEdit()">Save edit</button>' +
      '<button onclick="restoreOriginal()">Restore original</button>';
    dp.appendChild(act);
    main.appendChild(dp);
  } else {
    dp.innerHTML = "<h3>Draft reply</h3>" +
      (enq.lowConfidence || enq.draft.some(l => l.low)
        ? '<div class="watermark">⚠ DRAFT — contains low-confidence lines (dotted underline). Check before approving.</div>' : "");
    for (const line of enq.draft) {
      const div = document.createElement("div");
      div.className = "line" + (line.cite ? " cited" : "") + (line.low ? " low" : "");
      let chips = "";
      if (line.cite) {
        const page = POLICY_PAGES[line.cite[0]];
        chips += '<span class="cite-chip">cites: ' + page.title.replace(" (made up)", "") + "</span>";
        div.onclick = () => { shownCite = line.cite; track[enq.id].citesOpened++; render(); };
        if (shownCite && shownCite[0] === line.cite[0] && shownCite[1] === line.cite[1]) div.classList.add("showing");
      }
      if (line.low) chips += '<span class="low-chip">low confidence</span>';
      div.innerHTML = line.text + chips;
      dp.appendChild(div);
    }
    const rat = document.createElement("p");
    rat.className = "rationale";
    rat.textContent = "Why this draft: " + enq.rationale;
    dp.appendChild(rat);
    const act = document.createElement("div");
    act.className = "actions";
    act.innerHTML =
      '<button class="primary" onclick="approve()">Approve</button>' +
      '<button onclick="startEdit()">Edit</button>' +
      '<button onclick="restoreOriginal()" ' + (editedText[enq.id] ? "" : "disabled") + '>Restore original</button>';
    dp.appendChild(act);
    if (editedText[enq.id]) {
      const note = document.createElement("p");
      note.className = "rationale";
      note.textContent = "You have unsaved officer edits on this draft. Approve sends your edited version.";
      dp.appendChild(note);
    }
    main.appendChild(dp);
  }

  // Citation pane
  const cp = document.createElement("section");
  cp.className = "pane cite-pane";
  if (enq.draft === null && enq.closestPages) {
    cp.innerHTML = "<h3>Three closest policy pages</h3>";
    const ul = document.createElement("ul");
    ul.className = "closest";
    for (const pid of enq.closestPages) {
      const li = document.createElement("li");
      li.textContent = POLICY_PAGES[pid].title;
      ul.appendChild(li);
    }
    cp.appendChild(ul);
  } else if (shownCite) {
    const page = POLICY_PAGES[shownCite[0]];
    cp.innerHTML = "<h3>Cited passage</h3>";
    for (const [pid, text] of Object.entries(page.passages)) {
      const div = document.createElement("div");
      div.className = "passage" + (pid === shownCite[1] ? " hit" : "");
      div.innerHTML = text + '<div class="src">' + page.title + " · passage " + pid + "</div>";
      cp.appendChild(div);
    }
  } else {
    cp.innerHTML = '<h3>Cited passage</h3><p class="empty-hint">Click a draft line with a citation chip to see the exact policy passage it came from, highlighted.</p>';
  }
  main.appendChild(cp);
}

function markDecided() {
  if (sessionStart && track[activeId].decidedAt === null) track[activeId].decidedAt = Date.now();
}
function approve() {
  approved[activeId] = true;
  markDecided();
  editing = false;
  render();
}
function startEdit() { editing = true; track[activeId].editSessions++; render(); }
function saveEdit() {
  editedText[activeId] = document.getElementById("editor").value;
  editing = false;
  render();
}
function saveAndApprove() {
  editedText[activeId] = document.getElementById("editor").value;
  approved[activeId] = true;
  markDecided();
  editing = false;
  render();
}
function restoreOriginal() {
  delete editedText[activeId];
  editing = false;
  render();
}
function render() { renderInbox(); renderClock(); renderMain(); }
touchOpen(activeId);
render();
</script>
</body>
</html>
